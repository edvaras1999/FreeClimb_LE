; FreeClimbLE.ini - settings
; Written by the in-game menu (MCM) and by the plugin. Hand edits are reloaded the next time you grab a wall.
; Units are Skyrim units (1 unit ~ 1.4 cm).

[FreeClimb]

; ---- CLIMBING
; Max distance to look for a wall when jump is pressed.
Reach=110
; Distance from the character to the wall while clinging (30 = original mod).
WallGap=30
; Max distance to the wall to cling (the character is pulled to it).
AttachReach=65
; Reach to catch a wall in mid-air.
AirReach=90
; 1 = jumping next to a wall always clings; 0 = low walls are vaulted instead.
AlwaysCling=1
; 0 = Jump alone next to a wall; 1 = Jump + W + A + D together (original behaviour).
EntryMode=0
; 1 = turn the character to face the wall.
FaceWall=1
; Min ledge height (above the feet) to climb over.
MinLedge=80
; Max ledge height to climb over.
MaxLedge=180
; Head height: where the top of the wall is searched.
HeadHeight=125
; 1 = warp the character controller every update.
Warp=1

; ---- SPEED (0 = automatic: the clip's own speed)
; Climb speed, units/s. Original mod: 100.
ClimbSpeed=0
; Descend speed, units/s. Original mod: 78.
DownSpeed=0
; Sideways speed, units/s. Original mod: 82.
SideSpeed=0
; Multiplier for all automatic speeds.
SpeedScale=1
; Fraction of the speed when starting to move (1 = no ramp).
StartSpeed=0.45
; Seconds to reach full speed.
RampSeconds=0.7
; Wall run speed (Shift + direction), units/s.
WallRunSpeed=379.5
; Wall run speed multiplier on diagonals.
WallRunDiagonal=1.15

; ---- HOPS
; Hop distance multiplier.
HopScale=1.8
; Hop speed multiplier.
HopSpeed=1.1
; 1 = smooth hops (ease in and out).
HopEase=1
; 1 = read the wall before hopping; with no wall ahead the hop is a normal jump and you fall.
HopProbe=1
; 1 = hop automatically to the next wall when this one ends.
ContextHops=1
; Grab animation speed multiplier.
CatchSpeed=1.5

; ---- SLIDE (Shift + S)
; 1 = Shift + S on the wall slides down, accelerating; release to brake and keep hanging.
SlideEnabled=1
; Slide top speed, units/s.
SlideMaxSpeed=280
; Slide acceleration, units/s^2.
SlideAccel=220
; Slide stamina cost, % of max per second.
SlideStamina=1

; ---- SMOOTHING AND POSE ENGINE
; Turn smoothing, seconds (0 = instant).
TurnSmooth=0.15
; Max turn speed, degrees/s.
TurnSpeed=540
; Position smoothing when the wall changes direction, seconds (0 = instant).
PosSmooth=0.1
; 1 = write the pose before the game update (recommended); 0 = legacy method.
PoseMode=1
; Blend-in time into the climbing pose, seconds.
EntryBlend=0.14
; Blend-out time back to the game pose, seconds.
ExitBlend=0.22
; Blend time between moves, seconds.
MotionBlend=0.15
; Raises the body during the VERTICAL wall run (Shift + W) to center it on the camera. Sideways and diagonal runs are not affected.
RunHeight=60

; ---- STAMINA (percent of max stamina)
; 1 = climbing costs stamina.
StaminaEnabled=1
; Cost per second hanging still, % of max.
StaminaHang=1
; Cost per second climbing, % of max.
StaminaClimb=3
; Cost per second descending, % of max.
StaminaDown=1.5
; Cost per second moving sideways, % of max.
StaminaSide=3
; Cost per second wall running, % of max.
StaminaRun=8
; Cost of each hop, % of max.
StaminaHop=6
; Cost of pulling over a ledge, % of max (never refused).
StaminaMantle=4
; Difficulty multiplier for every stamina cost.
StaminaScale=1
; 1 = no stamina regeneration on the wall (it still regenerates while sliding after running out).
StaminaBlockRegen=1
; With no stamina, slide down at this speed, units/s.
StaminaSlideSpeed=25
; Stamina % needed to climb again after running out.
StaminaResume=15

; ---- SOUND
; 1 = play climbing sounds (grab, steps, push-off, ledge).
SoundEnabled=1
; Climbing sounds volume, 0 to 1.
SoundVolume=1
; Min gap between repeats of the same sound, milliseconds.
SoundGapMs=140

; ---- GAMEPAD
; 1 = left stick gives continuous direction and speed.
AnalogEnabled=1
; Left stick dead zone, 0 to 1.
AnalogDeadZone=0.25

; ---- HANDS AND FEET ON THE SURFACE (rays)
; 1 = hands and feet follow the real surface (trees, rocks, uneven walls) using rays.
SurfaceFit=1
; Rays per update for surface fitting (max 4 are used).
FitRays=4
; Below this frame rate only 1 ray per update is used.
FitMinFps=35

; ---- MENU AND DIAGNOSTICS
; Menu language: 0 = English, 1 = Portugues.
Language=0
; 1 = detailed log (also logs the camera position while clinging).
Verbose=0

; ---- OBSTACLES, NPCS AND PROTRUSIONS (ini only)
; 1 = NPCs, creatures and bodies are never treated as a wall or a ledge.
IgnoreActors=1
; 1 = only cling to something taller than EntryMinHeight (chests, small rocks and steps are left to the normal jump / parkour mod). 0 = old behaviour.
EntryHeightCheck=1
; Min height of the obstacle (above the ground) to cling to it. 0 = use MinLedge. The wall must reach about this height + 30.
EntryMinHeight=0
; 1 = standing still on the wall, the body is held exactly where it is (no per-frame re-fitting: no wobble, no camera shake). 0 = old behaviour.
StableHold=1
; 1 = eaves, cornices and bulges: hop over an overhang above the head, follow a wall that steps back, keep the body clear of bulges. 0 = flat walls only.
ProtrusionAssist=1
